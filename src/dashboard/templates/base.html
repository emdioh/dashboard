<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  {% set path = request.url.path %}
  <header>
    <strong>Dashboard</strong>
    <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Services</a>
    <a href="/history" {% if path == "/history" %}aria-current="page"{% endif %}>History</a>
    <a href="/ssh" {% if path == "/ssh" %}aria-current="page"{% endif %}>SSH setup</a>
    {% if apps %}<span class="sep"></span>{% endif %}
    {% for a in apps.values() %}
    <a href="/apps/{{ a.name }}" {% if path == "/apps/" ~ a.name %}aria-current="page"{% endif %}>{{ a.title }}</a>
    {% endfor %}
  </header>
  {% block main %}<main>{% block content %}{% endblock %}</main>{% endblock %}
</body>
</html>
