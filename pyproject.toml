[project]
name = "dashboard"
version = "0.1.0"
description = "Small web dashboard that redeploys git + docker compose services on Proxmox guests over SSH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.16.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
    "websockets>=17.3",
]

[project.scripts]
dashboard = "dashboard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
