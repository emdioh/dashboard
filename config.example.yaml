# Copy to /etc/dashboard/config.yaml (or point DASHBOARD_CONFIG at it).

# SSH key, known_hosts and deploy logs live here.
data_dir: /var/lib/dashboard

hosts:
  media:
    address: 10.0.0.21
    ctid: 121          # Proxmox container id: lets the SSH setup page give you a `pct exec` command
    # user: root       # default
    # port: 22         # default
  apps:
    address: 10.0.0.22
    ctid: 122

services:
  jellyfin:
    host: media
    repo_dir: /opt/jellyfin        # a git clone on the host; compose file lives here
    description: Media server
    # No default_ref: deploys the remote's default branch unless you type a ref.
    # No steps: uses `docker compose pull --ignore-buildable` + `docker compose up -d --build --remove-orphans`.

  myapp:
    host: apps
    repo_dir: /srv/myapp
    default_ref: production        # used when the ref box is left empty
    steps:                         # run in repo_dir after checkout; any failure stops the deploy
                                   # (the dashboard fetches and checks out the ref itself:
                                   #  don't add `git checkout` / `git pull` here)
      - ./scripts/pre-deploy.sh
      - docker compose down
      - docker compose up -d --build
    # Steps also see $DEPLOY_REF and $DEPLOY_SHA.

  trains:                          # no host: runs on the dashboard's own machine
    repo_dir: /opt/trains
    default_ref: trains
    steps:
      - sh deploy/install-release.sh

  upgrade-media:                   # no repo_dir: just commands, no git
    host: media
    description: Upgrade Alpine packages
    steps:
      - apk update
      - apk upgrade

  backup:                          # commands on the dashboard's machine
    dir: /srv/backups              # where the steps run (default: home)
    steps:
      - ./backup.sh "$DEPLOY_REF"  # the box's value, if any, is $DEPLOY_REF

# Web utilities listed on the Apps page (the home page). Each one's page is
# displayed inside the dashboard, proxied through it under /proxy/<name>/, so
# it only needs to be reachable from the dashboard (and sits behind its login).
apps:
  trains:
    title: Train punctuality
    url: http://10.0.0.30:5000
    description: Delays on my usual connections   # optional, shown on the Apps page
